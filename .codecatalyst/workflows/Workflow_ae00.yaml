Name: Workflow_ae00
SchemaVersion: "1.0"

# Optional - Set automatic triggers.
Triggers:
  - Type: PUSH
    Branches:
      - main
Actions:
  PushToAmazonECR_e5:
    # Identifies the action. Do not modify this value.
    Identifier: codecatalyst-labs/push-to-ecr@v1.1.0
    # Required; You can use an environment to access AWS resources.
    Environment:
      Name: jmilhas-env
    # Specifies the source and/or artifacts to pass to the action as input.
    Inputs:
      # Optional
      Sources:
        - WorkflowSource # This specifies that the action requires this Workflow as a source
      Variables:
        - Name: SERVER_PORT
          Value: "3335"
        - Name: GIN_MODE
          Value: release
        - Name: DB_HOST
          Value: jmilhas-db.c9yqesgqqcvf.us-west-2.rds.amazonaws.com
        - Name: DB_PORT
          Value: "5432"
        - Name: DB_USER
          Value: jornada_admin
        - Name: DB_PASSWORD
          Value: parangaricotirimicuaro
        - Name: DB_NAME
          Value: jmilhas-db
        - Name: ACCESS_TOKEN_TTL
          Value: "2"
        - Name: ACCESS_TOKEN_SECRET
          Value: parangaricotirimicuaro
        - Name: REFRESH_TTL
          Value: "5"
        - Name: REFRESH_SECRET
          Value: parangaricotirimicuaro
    Compute:
      Type: EC2 # Defines the action's properties.
    Configuration:
      RepositoryName: jmilhas-api
      AWSRegion: us-east-1
      PublicRepository: false
      ImageScanningConfiguration: false
  DeployToAWSAppRunner_8c:
    # Identifies the action. Do not modify this value.
    Identifier: codecatalyst-labs/deploy-to-app-runner@v1.1.0
    # Required; You can use an environment to access AWS resources.
    Environment:
      Name: jmilhas-env
    Compute:
      Type: EC2
    Configuration:
      Tags: "[]"
      StackName: jmilhas-stack
      Wait: true
      AWSRegion: us-east-1
      Port: 3333
      ImageIdentifier: 975334464943.dkr.ecr.sa-east-1.amazonaws.com/jmilhas-api:5060e2c
    DependsOn:
      - PushToAmazonECR_e5
