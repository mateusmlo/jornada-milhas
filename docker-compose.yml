services:
  jornadas-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3333:3333"
    networks:
      - app-network

  db:
    image: postgres:latest
    hostname: db
    command: postgres -c 'max_connections=600'
    environment:
      - POSTGRES_USER=jornada_admin
      - POSTGRES_PASSWORD=parangaricotirimicuaro
      - POSTGRES_DB=jmilhas-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U jornada_admin -d jmilhas-db'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
